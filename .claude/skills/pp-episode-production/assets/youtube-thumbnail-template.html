<!doctype html><html><head><meta charset="utf-8">
<title>PP YouTube Thumbnail — template</title>
<!-- ==========================================================================
     PRACTICAL PUNTING YOUTUBE THUMBNAIL — standing pattern (approved EP01-03,
     2026-07-21). 1280x720. A Higgsfield/stock HERO photo full-bleed, with the
     brand text laid over the clearest part of the frame.

     PER-EPISODE (only these change):
       1. Drop the hero as  hero.png  in PP-EPxx/thumbnail/  and copy
          pp-logo-on-dark.png in beside it.
       2. Edit .l1 / .l2 (the Anton headline: setup word WHITE, payoff word
          ORANGE), .part (or delete it on a non-series episode), and .strap.
          The .eyebrow is LOCKED to "How to Win at Horse Racing" — do not edit it.
       3. Build:  python scripts/render_still.py ep-xx-thumbnail.html \
                    ../output/PP-EPxx-thumbnail.png 1280 720   (run from the folder).

     PLACEMENT (this is the craft — VIEW the hero first, then decide):
       - Put all text over the hero's clearest, darkest, subject-free region.
         Horses charging from the right → text upper-LEFT (EP02/EP03). A head-on
         field under a stormy sky → text sits in the dark sky / dark rail (EP01).
       - Keep every line CLEAR of the horses. Size .l2 so its widest line ends
         before the nearest horse; narrow it (or drop a few px) if it collides.
       - SCRIM = full-bleed ANGLED linear gradient only. NEVER a part-height or
         part-width band (hard edges) or a radial (visible oval) — the banner
         lesson. Dial its opacity to the hero: bright sky/turf → strong (0.9ish
         at the dark corner); an already-dark stormy sky → lighter (~0.8) so you
         don't crush the drama. Rotate the angle (118-128deg) toward the text.
       - Headline BIG and bold so it reads on a phone. Real brand fonts only
         (Anton headline, Barlow elsewhere); render_still.py waits for webfonts.
       - Spare heroes live in  PP Videos/assets/thumbnail-heroes/  (descriptive
         names) — check there before generating a new one.
     ========================================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#000}
  .thumb{position:relative;width:1280px;height:720px;overflow:hidden;font-family:'Barlow',sans-serif}
  .hero{position:absolute;inset:0;width:1280px;height:720px;object-fit:cover;object-position:center;display:block}
  /* Full-bleed angled scrim: darkest at the top-left where the title sits,
     fading to clear across the subject. Tune the % stops / opacities per hero. */
  .scrim{position:absolute;inset:0;background:linear-gradient(123deg,
    rgba(8,10,14,0.94) 0%,
    rgba(8,10,14,0.88) 20%,
    rgba(8,10,14,0.64) 38%,
    rgba(8,10,14,0.28) 52%,
    rgba(8,10,14,0.07) 66%,
    rgba(8,10,14,0) 78%)}
  /* gentle bottom weight so the logo sits on something */
  .scrim-b{position:absolute;inset:0;background:linear-gradient(to top,
    rgba(8,10,14,0.55) 0%, rgba(8,10,14,0) 24%)}

  .copy{position:absolute;left:56px;top:52px;width:660px}
  .eyebrow{font-family:'Barlow',sans-serif;font-weight:800;font-size:29px;
    letter-spacing:0.20em;text-transform:uppercase;color:#DA532C;margin-bottom:18px;
    text-shadow:0 2px 10px rgba(0,0,0,0.7)}
  .l1,.l2,.part{font-family:'Anton','Barlow',sans-serif;font-weight:400;color:#FFFFFF;
    text-transform:uppercase;line-height:0.88;letter-spacing:0.006em;
    text-shadow:0 6px 30px rgba(0,0,0,0.8)}
  .l1{font-size:96px}                        /* setup word(s) — WHITE */
  .l2{font-size:150px;color:#DA532C}         /* payoff word(s) — ORANGE (the locked split) */
  /* 3. SERIES PART TREATMENT — half the .l2 size, own line, NO em dash. */
  .part{font-size:75px;color:#DA532C;margin-top:12px;letter-spacing:0.03em}
  .bar{width:230px;height:14px;background:#DA532C;margin:24px 0 18px;border-radius:2px;
    box-shadow:0 4px 16px rgba(0,0,0,0.5)}
  .strap{font-family:'Barlow',sans-serif;font-weight:700;font-size:29px;
    letter-spacing:0.02em;color:#F1F1F1;line-height:1.24;text-shadow:0 3px 14px rgba(0,0,0,0.85)}
  .logo{position:absolute;left:56px;bottom:40px;width:210px;display:block;
    filter:drop-shadow(0 4px 14px rgba(0,0,0,0.7))}
</style></head>
<body>
<div class="thumb">
  <img class="hero" src="hero.png" alt="">
  <div class="scrim"></div>
  <div class="scrim-b"></div>
  <div class="copy">
    <div class="eyebrow">How to Win at Horse Racing</div>
    <div class="l1">Setup line</div>
    <div class="l2">Key word</div>
    <div class="part">Part N</div><!-- DELETE on a non-series episode -->
    <div class="bar"></div>
    <div class="strap">One-line hook the viewer wants</div>
  </div>
  <img class="logo" src="pp-logo-on-dark.png" alt="">
</div>
</body></html>
