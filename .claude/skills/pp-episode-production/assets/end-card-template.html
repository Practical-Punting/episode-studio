<!doctype html><html><head><meta charset="utf-8"><title>PP — End Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0}body{width:1920px;height:1080px;overflow:hidden;background:#1F1F1F}</style>
<script src="pp-anim.js"></script>
</head>
<body>
<div style="box-sizing:border-box;width:1920px;height:1080px;background:#1F1F1F;position:relative;overflow:hidden;font-family:'Barlow',sans-serif;color:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:110px;padding:80px 140px;">
<img id="cover" src="ebook-cover.png" alt="The Practical Punting Guide — Killer Strategies for the Trifecta" style="height:860px;width:auto;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,0.55);">
<div style="display:flex;flex-direction:column;align-items:flex-start;max-width:820px;">
<div id="rule" style="width:64px;height:4px;background:#DA532C;transform-origin:left center;"></div>
<div id="eyebrow" style="margin-top:30px;font-family:'Barlow',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:0.22em;font-size:34px;color:#B9B9B9;">Free guide</div>
<div id="cta" style="margin-top:26px;font-family:'Anton','Barlow',sans-serif;font-weight:400;text-transform:uppercase;font-size:132px;line-height:1.05;">Free — <span style="color:#DA532C;">link below</span></div>
<div id="arrow" style="margin-top:44px;width:0;height:0;border-left:44px solid transparent;border-right:44px solid transparent;border-top:56px solid #DA532C;"></div>
</div>
<img id="logo" src="assets/logo.png" alt="Practical Punting" style="position:absolute;right:110px;bottom:84px;width:214px;height:65px;">
</div>
<script>ppInit([
{"sel":"#cover","kf":[{"opacity":0,"transform":"translateY(60px)"},{"opacity":1,"transform":"translateY(0)"}],"opts":{"duration":800,"delay":100,"easing":"cubic-bezier(0.16, 1, 0.3, 1)"}},
{"sel":"#rule","kf":[{"transform":"scaleX(0)"},{"transform":"scaleX(1)"}],"opts":{"duration":500,"delay":500,"easing":"ease-out"}},
{"sel":"#eyebrow","kf":[{"opacity":0,"transform":"translateY(30px)"},{"opacity":1,"transform":"translateY(0)"}],"opts":{"duration":600,"delay":700,"easing":"cubic-bezier(0.16, 1, 0.3, 1)"}},
{"sel":"#cta","kf":[{"opacity":0,"transform":"translateY(48px)"},{"opacity":1,"transform":"translateY(0)"}],"opts":{"duration":700,"delay":950,"easing":"cubic-bezier(0.16, 1, 0.3, 1)"}},
{"sel":"#arrow","kf":[{"opacity":0,"transform":"translateY(-24px)"},{"opacity":1,"transform":"translateY(0)","offset":0.55},{"opacity":1,"transform":"translateY(-12px)","offset":0.8},{"opacity":1,"transform":"translateY(0)"}],"opts":{"duration":900,"delay":1500,"easing":"ease-out"}},
{"sel":"#logo","kf":[{"opacity":0},{"opacity":1}],"opts":{"duration":600,"delay":2000,"easing":"ease-out"}}
]);</script>
</body></html>
