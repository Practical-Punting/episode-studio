<!doctype html><html><head><meta charset="utf-8">
<title>PP YouTube Channel Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#000}
  /* 2560x1440 YouTube channel art. Safe area = centre 1546x423 (x 507-2053, y 508-931). */
  .banner{position:relative;width:2560px;height:1440px;overflow:hidden;font-family:'Barlow',sans-serif}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 55%}
  /* Scrim: overall gentle darkening + a stronger feathered band across the safe strip,
     so white type stays crisp over the horses without hiding the photo. */
  .scrim-all{position:absolute;inset:0;background:rgba(12,14,18,0.22)}
  /* Full-bleed vertical gradient: spans the entire width, so it has no side
     edges to betray it, and no shape against the smooth sky (a radial pooled
     into a visible dark oval; a part-width band gave hard horizontal lines).
     Darkest across 35-65% height = exactly the safe strip (y 508-931). */
  .scrim-band{position:absolute;inset:0;
    background:linear-gradient(to bottom,
      rgba(12,14,18,0) 0%,
      rgba(12,14,18,0) 16%,
      rgba(12,14,18,0.30) 27%,
      rgba(12,14,18,0.62) 38%,
      rgba(12,14,18,0.70) 50%,
      rgba(12,14,18,0.62) 62%,
      rgba(12,14,18,0.30) 73%,
      rgba(12,14,18,0) 84%,
      rgba(12,14,18,0) 100%)}

  .safe{position:absolute;left:507px;top:508px;width:1546px;height:423px;
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  .lockup{display:flex;align-items:center;gap:44px}
  .badge{width:172px;height:172px;border-radius:26px;display:block;
    box-shadow:0 14px 40px rgba(0,0,0,0.45)}
  .title{font-family:'Anton','Barlow',sans-serif;font-weight:400;color:#fff;
    font-size:132px;line-height:0.94;letter-spacing:0.012em;text-transform:uppercase;
    text-shadow:0 4px 26px rgba(0,0,0,0.55)}
  .rule{width:300px;height:5px;background:#DA532C;margin:26px 0 20px 0;border-radius:3px}
  .tagline{font-family:'Barlow',sans-serif;font-weight:600;color:#F2F2F2;
    font-size:45px;letter-spacing:0.055em;text-transform:uppercase;
    text-shadow:0 3px 18px rgba(0,0,0,0.6)}
</style></head>
<body>
<div class="banner">
  <img class="bg" src="banner-bg.png" alt="">
  <div class="scrim-all"></div>
  <div class="scrim-band"></div>
  <div class="safe">
    <div class="lockup">
      <img class="badge" src="pp-youtube-icon-800.png" alt="">
      <div class="title">Practical Punting</div>
    </div>
    <div class="rule"></div>
    <div class="tagline">Everything You Need to Know About Punting</div>
  </div>
</div>
</body></html>
